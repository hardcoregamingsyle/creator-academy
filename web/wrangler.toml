name = "createva-proxy"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-24"
# nodejs_compat also populates process.env from the vars/secrets below, so the
# server code can keep reading process.env.X exactly as it did under Next.js.
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
SITE_URL = "https://www.createva.co.in"
CONTACT_EMAIL = "createva28@gmail.com"
# Secrets (set with `wrangler pages secret put`): DATABASE_URL,
# DATABASE_AUTH_TOKEN, ADMIN_PASSWORD, SESSION_SECRET, RESEND_API_KEY and,
# when enabled, RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET.
#
# Live classes (the room itself runs in the createva-live Worker, see live-worker/wrangler.toml):
#   LIVE_WS_URL        var: the room Worker's socket base, e.g. wss://createva-live.<account>.workers.dev/room
#   LIVE_SECRET        secret: signs class tickets; must equal LIVE_SECRET on the createva-live Worker
#                      (falls back to SESSION_SECRET when unset, but then set SESSION_SECRET on the Worker too)
#   CRON_SECRET        secret: Bearer token for POST /api/internal/reminders; must equal CRON_SECRET on the Worker
#   CF_SFU_APP_ID      secret: Cloudflare Realtime SFU app id    } screen sharing stays hidden in the UI
#   CF_SFU_APP_SECRET  secret: Cloudflare Realtime SFU app secret } until both are set
