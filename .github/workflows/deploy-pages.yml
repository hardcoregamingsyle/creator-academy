name: Deploy to Cloudflare Pages

# Builds the Vite + React SPA and its Pages Functions API (web/) and deploys it
# to the createva-proxy Pages project on every push to main. Runtime
# configuration (DATABASE_URL, ADMIN_PASSWORD, ...) lives in the Pages project's
# secrets (set with `wrangler pages secret put`), not in this repo or workflow.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Deploy
        run: npx wrangler pages deploy dist --project-name=createva-proxy --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
